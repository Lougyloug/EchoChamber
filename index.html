<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Chamber Events</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    header {
      padding: 40px 20px 20px;
    }

    .brand-title {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .tagline {
      color: #94a3b8;
      font-size: 1.15rem;
      font-weight: 400;
    }

    main {
      max-width: 600px;
      width: 100%;
      background: #1e293b;
      padding: 36px;
      border-radius: 16px;
      border: 1px solid #334155;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      margin: 20px 0;
    }

    h2 {
      font-size: 1.5rem;
      color: #f8fafc;
      margin-bottom: 12px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .cta-button {
      display: inline-block;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      color: #ffffff;
      text-decoration: none;
      padding: 14px 28px;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 8px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(56, 189, 248, 0.3);
    }

    footer {
      color: #64748b;
      font-size: 0.875rem;
      padding: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1 class="brand-title">ECHO CHAMBER EVENTS</h1>
    <p class="tagline">Amplifying Sound, Scene, & Experience.</p>
  </header>

  <main>
    <h2>Upcoming Events & Announcements</h2>
    <p>We are currently building something special. Stay tuned for upcoming event dates, ticket drops, and venue announcements.</p>
    <button class="cta-button" onclick="notifyMe()">Get Notified</button>
  </main>

  <footer>
    &copy; 2026 Echo Chamber Events. All rights reserved.
  </footer>

  <script>
    function notifyMe() {
      alert("Thanks for your interest! Official lineup and event updates coming soon.");
    }
  </script>

</body>
</html>
