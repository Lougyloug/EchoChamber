<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Chamber Events</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.35;
      will-change: transform;
    }

    .orb.one {
      width: 420px; height: 420px;
      background: #38bdf8;
      top: -120px; left: -100px;
      animation: drift1 18s ease-in-out infinite alternate;
    }

    .orb.two {
      width: 480px; height: 480px;
      background: #818cf8;
      bottom: -160px; right: -120px;
      animation: drift2 22s ease-in-out infinite alternate;
    }

    .orb.three {
      width: 300px; height: 300px;
      background: #6366f1;
      top: 45%; left: 55%;
      opacity: 0.2;
      animation: drift3 26s ease-in-out infinite alternate;
    }

    @keyframes drift1 {
      to { transform: translate(180px, 140px) scale(1.2); }
    }
    @keyframes drift2 {
      to { transform: translate(-200px, -120px) scale(1.15); }
    }
    @keyframes drift3 {
      to { transform: translate(-260px, 120px) scale(0.8); }
    }

    .ripple {
      position: absolute;
      top: 50%; left: 50%;
      width: 200px; height: 200px;
      margin: -100px 0 0 -100px;
      border: 2px solid rgba(56, 189, 248, 0.5);
      border-radius: 50%;
      opacity: 0;
      animation: echo 9s cubic-bezier(0.2, 0.6, 0.3, 1) infinite;
    }
    .ripple:nth-child(4) { animation-delay: 1.8s; }
    .ripple:nth-child(5) { animation-delay: 3.6s; }
    .ripple:nth-child(6) { animation-delay: 5.4s; }
    .ripple:nth-child(7) { animation-delay: 7.2s; }

    @keyframes echo {
      0%   { transform: scale(0.2); opacity: 0.6; border-color: rgba(56, 189, 248, 0.6); }
      70%  { opacity: 0.12; border-color: rgba(129, 140, 248, 0.4); }
      100% { transform: scale(7); opacity: 0; }
    }

    header, main, footer {
      position: relative;
      z-index: 1;
    }

    header {
      padding: 40px 20px 20px;
    }

    .brand-title {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc, #38bdf8);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      animation:
        titleIn 1.1s cubic-bezier(0.16, 1, 0.3, 1) both,
        gradientFlow 8s ease-in-out infinite 1.1s;
    }

    @keyframes titleIn {
      0%   { opacity: 0; letter-spacing: 14px; filter: blur(14px); transform: scale(1.08); }
      100% { opacity: 1; letter-spacing: -1px; filter: blur(0); transform: scale(1); }
    }

    @keyframes gradientFlow {
      0%, 100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }

    .tagline {
      color: #94a3b8;
      font-size: 1.15rem;
      font-weight: 400;
      animation: fadeUp 0.9s ease-out 0.7s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    main {
      max-width: 600px;
      width: 100%;
      background: #1e293b;
      padding: 36px;
      border-radius: 16px;
      border: 1px solid #334155;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      margin: 20px 0;
      overflow: hidden;
      animation:
        cardIn 1s cubic-bezier(0.16, 1, 0.3, 1) 1s both,
        float 6s ease-in-out 2s infinite,
        glow 4s ease-in-out 2s infinite;
    }

    main::before {
      content: "";
      position: absolute;
      top: 0; left: -60%;
      width: 40%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.07), transparent);
      transform: skewX(-20deg);
      animation: sweep 6s ease-in-out 2.5s infinite;
      pointer-events: none;
    }

    @keyframes sweep {
      0%   { left: -60%; }
      40%, 100% { left: 130%; }
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(50px) scale(0.94) rotateX(12deg); }
      to   { opacity: 1; transform: translateY(0) scale(1) rotateX(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }

    @keyframes glow {
      0%, 100% { border-color: #334155; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
      50%      { border-color: rgba(56, 189, 248, 0.55); box-shadow: 0 20px 40px -5px rgba(56, 189, 248, 0.22); }
    }

    h2 {
      font-size: 1.5rem;
      color: #f8fafc;
      margin-bottom: 12px;
      animation: fadeUp 0.8s ease-out 1.5s both;
    }

    p {
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    main p {
      animation: fadeUp 0.8s ease-out 1.7s both;
    }

    .cta-button {
      display: inline-block;
      position: relative;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      color: #ffffff;
      text-decoration: none;
      padding: 14px 28px;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 8px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      border: none;
      overflow: visible;
      animation:
        popIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 1.9s both,
        pulse 2.4s ease-out 2.8s infinite;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.5); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.55); }
      70%  { box-shadow: 0 0 0 18px rgba(56, 189, 248, 0); }
      100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
    }

    .cta-button:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 10px 15px -3px rgba(56, 189, 248, 0.3);
      animation: popIn 0.7s both;
    }

    .cta-button:active {
      transform: scale(0.95);
    }

    footer {
      color: #64748b;
      font-size: 0.875rem;
      padding: 20px;
      animation: fadeUp 1s ease-out 2.3s both;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        animation-delay: 0s !important;
      }
    }
  </style>
</head>
<body>

  <div class="bg" aria-hidden="true">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
    <div class="ripple"></div>
    <div class="ripple"></div>
    <div class="ripple"></div>
    <div class="ripple"></div>
    <div class="ripple"></div>
  </div>

  <header>
    <h1 class="brand-title">ECHO CHAMBER EVENTS</h1>
    <p class="tagline">Amplifying Sound, Scene, & Experience.</p>
  </header>

  <main>
    <h2>Upcoming Events & Announcements</h2>
    <p>We are currently building something special. Stay tuned for upcoming event dates, ticket drops, and venue announcements.</p>
    <button class="cta-button" onclick="notifyMe()">Get Notified</button>
  </main>

  <footer>
    &copy; 2026 Echo Chamber Events. All rights reserved.
  </footer>

  <script>
    function notifyMe() {
      alert("Thanks for your interest! Official lineup and event updates coming soon.");
    }
  </script>

</body>
</html>
